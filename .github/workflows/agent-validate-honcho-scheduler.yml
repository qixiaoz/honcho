name: Agent clean Honcho maintenance refs

on:
  pull_request:
    branches:
      - custom

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out published custom branch
        uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0

      - name: Verify publication and delete temporary branches
        shell: bash
        env:
          CANDIDATE_SHA: 7fa117803df5fc49dc4e8ae59dba9206bcd66d72
          UPSTREAM_SHA: 148f646796067bf7da9c7b7121a21cd47f86039e
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          git remote add upstream https://github.com/plastic-labs/honcho.git
          git fetch --no-tags upstream main
          test "$(git rev-parse upstream/main)" = "${UPSTREAM_SHA}"
          test "$(git merge-base HEAD upstream/main)" = "${UPSTREAM_SHA}"
          test "$(git rev-list --count upstream/main..HEAD)" = "4"
          test "$(git rev-list --merges --count upstream/main..HEAD)" = "0"

          git push origin --delete \
            agent/fix-dream-scheduler-fallback-20260804 \
            agent/format-honcho-custom-20260804 \
            agent/rebuild-base-20260804 \
            agent/validate-honcho-scheduler-20260804

          echo "Temporary Honcho maintenance branches deleted"
